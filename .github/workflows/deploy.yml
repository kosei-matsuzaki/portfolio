name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限（連続 push しても最後の1つだけ公開される）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 元リポジトリは CI に無いので、参照の整合性だけを見る
      # （projects.ts が指している画像・動画が public/ にあるか）
      - name: Check asset references
        run: npm run check -- --refs

      - name: Build (static export)
        run: npm run build
        env:
          # リポジトリ名のサブディレクトリに公開する場合は
          # GitHub の Settings > Secrets and variables > Actions > Variables に
          # NEXT_PUBLIC_BASE_PATH = /<リポジトリ名> を登録する
          # （<user>.github.io リポジトリや独自ドメインなら未設定でよい）
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
